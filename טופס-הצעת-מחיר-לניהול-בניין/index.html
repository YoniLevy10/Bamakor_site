<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טופס הצעת מחיר לניהול בניין | ש.נ. במקור</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; direction: rtl; background: #f4f4f4; color: #3A3A3A; }

header {
  background: #A31232;
  padding: 16px 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header .logo { color: white; font-size: 18px; font-weight: bold; text-decoration: none; }
header a.back { color: rgba(255,255,255,0.85); font-size: 13px; text-decoration: none; }
header a.back:hover { color: white; }

.hero {
  background: #A31232;
  color: white;
  text-align: center;
  padding: 30px 20px 40px;
}
.hero h1 { font-size: 26px; margin-bottom: 8px; }
.hero p { font-size: 15px; opacity: 0.9; }

.card {
  max-width: 680px;
  margin: -20px auto 40px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  padding: 36px 40px;
}

.form-group { margin-bottom: 18px; }
label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 6px; color: #444; }
input, select, textarea {
  width: 100%; padding: 11px 13px;
  border: 1px solid #ddd; border-radius: 5px;
  font-size: 14px; font-family: Arial, sans-serif;
  direction: rtl; transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: #A31232;
}
textarea { height: 90px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.contact-box {
  background: #fdf5f7;
  border: 1px solid #f0d0d8;
  border-radius: 6px;
  padding: 18px 20px;
  margin-bottom: 24px;
  font-size: 14px;
  color: #555;
}
.contact-box strong { color: #A31232; display: block; margin-bottom: 10px; font-size: 15px; }
.contact-box a { color: #A31232; text-decoration: none; display: block; margin-bottom: 5px; }
.contact-box a:hover { text-decoration: underline; }

.btn {
  background: #A31232; color: white; border: none;
  padding: 14px 30px; border-radius: 5px;
  font-size: 16px; cursor: pointer; width: 100%;
  margin-top: 8px; font-family: Arial, sans-serif;
  transition: background 0.2s;
}
.btn:hover { background: #8a0f28; }

.divider { border: none; border-top: 1px solid #eee; margin: 24px 0; }

footer {
  text-align: center; color: #999; font-size: 12px;
  padding: 24px; background: #3A3A3A; color: #aaa;
}
footer a { color: #ccc; }

@media(max-width:600px) {
  .row { grid-template-columns: 1fr; }
  .card { margin: -20px 12px 30px; padding: 24px 20px; }
  .hero h1 { font-size: 22px; }
}
</style>
</head>
<body>

<header>
  <a class="logo" href="/">ש.נ. במקור ניהול ואחזקת נכסים</a>
  <a class="back" href="/">→ חזרה לאתר</a>
</header>

<div class="hero">
  <h1>הצעת מחיר לניהול בניין</h1>
  <p>מלאו את הפרטים ונחזור אליכם בהקדם</p>
</div>

<div class="card">

  <div class="contact-box">
    <strong>📞 מעדיפים לדבר ישירות?</strong>
    <a href="tel:+972526026437">052-602-6437</a>
    <a href="mailto:sarah@bamakor.com">sarah@bamakor.com</a>
    <a href="mailto:office@bamakor.com">office@bamakor.com</a>
  </div>

  <div class="form-group">
    <label>שם מלא *</label>
    <input type="text" id="name" placeholder="שם פרטי ומשפחה">
  </div>

  <div class="row">
    <div class="form-group">
      <label>טלפון *</label>
      <input type="tel" id="phone" placeholder="05X-XXXXXXX">
    </div>
    <div class="form-group">
      <label>אימייל</label>
      <input type="email" id="email" placeholder="your@email.com">
    </div>
  </div>

  <div class="form-group">
    <label>כתובת הבניין *</label>
    <input type="text" id="address" placeholder="רחוב, מספר, עיר">
  </div>

  <div class="row">
    <div class="form-group">
      <label>מספר דירות</label>
      <select id="units">
        <option value="">בחר...</option>
        <option>עד 10 דירות</option>
        <option>11–20 דירות</option>
        <option>21–40 דירות</option>
        <option>41–60 דירות</option>
        <option>מעל 60 דירות</option>
      </select>
    </div>
    <div class="form-group">
      <label>מצב נוכחי</label>
      <select id="status">
        <option value="">בחר...</option>
        <option>ללא ניהול</option>
        <option>מעבר מחברה אחרת</option>
        <option>בניין חדש</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>הערות / שאלות</label>
    <textarea id="notes" placeholder="כל מידע נוסף שיעזור לנו..."></textarea>
  </div>

  <button class="btn" onclick="sendForm()">שלח בקשה</button>

</div>

<footer>
  ש.נ. במקור ניהול ואחזקת נכסים בע"מ | ירושלים |
  <a href="tel:+972526026437">052-602-6437</a>
</footer>

<script>
function sendForm() {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  if (!name || !phone || !address) {
    alert('נא למלא שם, טלפון וכתובת הבניין');
    return;
  }
  const body = encodeURIComponent(
    'שם: ' + name + '\n' +
    'טלפון: ' + phone + '\n' +
    'אימייל: ' + document.getElementById('email').value + '\n' +
    'כתובת: ' + address + '\n' +
    'מספר דירות: ' + document.getElementById('units').value + '\n' +
    'מצב: ' + document.getElementById('status').value + '\n' +
    'הערות: ' + document.getElementById('notes').value
  );
  window.location.href = 'mailto:office@bamakor.com?subject=' +
    encodeURIComponent('בקשת הצעת מחיר - ניהול בניין') + '&body=' + body;
}
</script>

</body>
</html>
